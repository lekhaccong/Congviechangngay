name: Unzip Resources and Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Bước 1: Giải nén file zip (Thay 'path/to/your_file.zip' và 'path/to/destination' tương ứng)
      - name: Unzip required resources
        run: |
          mkdir -p app/src/main/res
          unzip -o path/to/your_file.zip -d app/src/main/res/

      # Bước 2: Cấu hình Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # Bước 3: Cấp quyền chạy cho Gradle Wrapper
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Bước 4: Chạy lệnh Build APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # Bước 5: Tải file APK sau khi build thành công lên Artifacts
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          
